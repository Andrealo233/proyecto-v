{% extends "principal.html" %}
{% block title %}Dashboard Principal{% endblock %}
{% block content %}
<div class="modulo-card">
  <h5 class="fw-bold text-success mb-3">📊 Dashboard Principal — Resumen Comunitario</h5>
  <div class="row g-3 mb-4 text-center">
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#93c5fd,#a5b4fc);color:#1e3a8a"><small>USUARIOS</small><h4 class="fw-bold mb-0">1.254</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#c4b5fd,#d8b4fe);color:#581c87"><small>SERVICIOS ACTIVOS</small><h4 class="fw-bold mb-0">412</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#fcd34d,#fdba74);color:#7c2d12"><small>RECAUDO JULIO</small><h4 class="fw-bold mb-0">$12.5M</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#f9a8d4,#fda4af);color:#831843"><small>PQRS PENDIENTES</small><h4 class="fw-bold mb-0">18</h4></div></div>
  </div>
  <div class="row g-4">
    <div class="col-md-7"><canvas id="graficaVentasInstalacion" height="130"></canvas></div>
    <div class="col-md-5"><canvas id="graficaServicios" height="130"></canvas></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  new Chart(document.getElementById('graficaVentasInstalacion'), {
    type: 'bar',
    data: { labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul'], datasets: [{ label: 'Ventas de instalación', data: [850, 920, 780, 1100, 950, 1020, 1150], backgroundColor: ['#93c5fd','#a5b4fc','#c4b5fd','#d8b4fe','#fcd34d','#fdba74','#f9a8d4'], borderRadius: 6 }] }
  });
  new Chart(document.getElementById('graficaServicios'), {
    type: 'doughnut',
    data: { labels: ['Activos', 'Suspendidos', 'Revisión'], datasets: [{ data: [380, 25, 7], backgroundColor: ['#93c5fd', '#fcd34d', '#f9a8d4'] }] }
  });
</script>
{% endblock %}
