{% extends "principal.html" %}
{% block title %}Dashboard Principal{% endblock %}
{% block content %}
<div class="modulo-card">
  <h5 class="fw-bold text-success mb-3">📊 Dashboard Principal — Resumen Comunitario</h5>
  <div class="row g-3 mb-4 text-center">
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#60a5fa,#818cf8);color:#fff"><small>USUARIOS</small><h4 class="fw-bold mb-0">1.254</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#a78bfa,#c084fc);color:#fff"><small>SERVICIOS ACTIVOS</small><h4 class="fw-bold mb-0">412</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#fbbf24,#fb923c);color:#fff"><small>RECAUDO JULIO</small><h4 class="fw-bold mb-0">$12.5M</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#f472b6,#fb7185);color:#fff"><small>PQRS PENDIENTES</small><h4 class="fw-bold mb-0">18</h4></div></div>
  </div>
  <div class="row g-4">
    <div class="col-md-7"><canvas id="graficaVentasInstalacion" height="130"></canvas></div>
    <div class="col-md-5"><canvas id="graficaServicios" height="130"></canvas></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const ctx1 = document.getElementById('graficaVentasInstalacion');
  const g1 = ctx1.getContext('2d');
  const colors1 = ['#60a5fa','#818cf8','#a78bfa','#c084fc','#fbbf24','#fb923c','#f472b6'];
  const grads1 = colors1.map(c => {
    const gr = g1.createLinearGradient(0,0,0,ctx1.height);
    gr.addColorStop(0, c);
    gr.addColorStop(1, c + '55');
    return gr;
  });
  new Chart(ctx1, {
    type: 'bar',
    data: { labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul'], datasets: [{ label: 'Ventas de instalación', data: [850, 920, 780, 1100, 950, 1020, 1150], backgroundColor: grads1, borderRadius: 6 }] }
  });
  const ctx2 = document.getElementById('graficaServicios');
  const g2 = ctx2.getContext('2d');
  const colors2 = ['#60a5fa', '#fbbf24', '#f472b6'];
  const grads2 = colors2.map(c => {
    const gr = g2.createRadialGradient(ctx2.width/2, ctx2.height/2, 0, ctx2.width/2, ctx2.height/2, ctx2.width/2);
    gr.addColorStop(0, c);
    gr.addColorStop(1, c + '66');
    return gr;
  });
  new Chart(ctx2, {
    type: 'doughnut',
    data: { labels: ['Activos', 'Suspendidos', 'Revisión'], datasets: [{ data: [380, 25, 7], backgroundColor: grads2 }] }
  });
</script>
{% endblock %}
