{% extends "principal.html" %}
{% block title %}Dashboard Principal{% endblock %}
{% block content %}
<div class="modulo-card">
  <h5 class="fw-bold text-success mb-3">📊 Dashboard Principal — Resumen Comunitario</h5>
  <div class="row g-3 mb-4 text-center">
    <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><small class="text-muted">USUARIOS</small><h4 class="fw-bold mb-0">1.254</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><small class="text-muted">SERVICIOS ACTIVOS</small><h4 class="fw-bold text-success mb-0">412</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><small class="text-muted">RECAUDO JULIO</small><h4 class="fw-bold text-success mb-0">$12.5M</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><small class="text-muted">PQRS PENDIENTES</small><h4 class="fw-bold text-warning mb-0">18</h4></div></div>
  </div>
  <div class="row g-4">
    <div class="col-md-7"><canvas id="graficaConsumo" height="130"></canvas></div>
    <div class="col-md-5"><canvas id="graficaServicios" height="130"></canvas></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  new Chart(document.getElementById('graficaConsumo'), {
    type: 'bar',
    data: { labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul'], datasets: [{ label: 'Consumo m³', data:, backgroundColor: '#146c38', borderRadius: 6 }] }
  });
  new Chart(document.getElementById('graficaServicios'), {
    type: 'doughnut',
    data: { labels: ['Activos', 'Suspendidos', 'Revisión'], datasets: [{ data:, backgroundColor: ['#146c38', '#dc2626', '#f59e0b'] }] }
  });
</script>
{% endblock %}
