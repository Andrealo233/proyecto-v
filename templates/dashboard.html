{% extends "principal.html" %}
{% block title %}Dashboard Principal{% endblock %}
{% block content %}
<div class="modulo-card">
  <h5 class="fw-bold text-success mb-3">📊 Dashboard Principal — Resumen Comunitario</h5>
  <div class="row g-3 mb-4 text-center">
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#146c38,#1b8245);color:#fff"><small>USUARIOS</small><h4 class="fw-bold mb-0">1.254</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#1b8245,#22c55e);color:#fff"><small>SERVICIOS ACTIVOS</small><h4 class="fw-bold mb-0">412</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#22c55e,#4ade80);color:#14532d"><small>RECAUDO JULIO</small><h4 class="fw-bold mb-0">$12.5M</h4></div></div>
    <div class="col-md-3"><div class="p-3 border rounded-3" style="background:linear-gradient(135deg,#4ade80,#86efac);color:#14532d"><small>PQRS PENDIENTES</small><h4 class="fw-bold mb-0">18</h4></div></div>
  </div>
  <div class="row g-4">
    <div class="col-md-7"><canvas id="graficaVentasInstalacion" height="130"></canvas></div>
    <div class="col-md-5"><canvas id="graficaServicios" height="130"></canvas></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  new Chart(document.getElementById('graficaVentasInstalacion'), {
    type: 'bar',
    data: { labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul'], datasets: [{ label: 'Ventas de instalación', data: [850, 920, 780, 1100, 950, 1020, 1150], backgroundColor: '#146c38', borderRadius: 6 }] }
  });
  new Chart(document.getElementById('graficaServicios'), {
    type: 'doughnut',
    data: { labels: ['Activos', 'Suspendidos', 'Revisión'], datasets: [{ data: [380, 25, 7], backgroundColor: ['#146c38', '#dc2626', '#f59e0b'] }] }
  });
</script>
{% endblock %}
