<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeredalApp - Ingreso y Registro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="smoking-wrapper">
    <div class="login-card">
      <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-login-grande mb-2">
        <h4 class="fw-bold text-success mb-0">VeredalApp</h4>
        <small class="text-muted">Ingreso y Registro Comunitario</small>
      </div>

      <ul class="nav nav-pills nav-fill mb-3 bg-light p-1 rounded-pill" role="tablist">
        <li class="nav-item"><button class="nav-link active rounded-pill small fw-bold" data-bs-toggle="pill" data-bs-target="#tabIngresar" type="button">🔑 Ingresar</button></li>
        <li class="nav-item"><button class="nav-link rounded-pill small fw-bold" data-bs-toggle="pill" data-bs-target="#tabRegistrar" type="button">📝 Registrar</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabIngresar">
          <form action="/login" method="POST">
            <div class="mb-3"><label class="form-label small fw-bold">Usuario o Cédula</label><input type="text" name="usuario" class="form-control" required></div>
            <div class="mb-3"><label class="form-label small fw-bold">Contraseña</label><input type="password" name="clave" class="form-control" required></div>
            <button type="submit" class="btn btn-verde w-100">Entrar</button>
          </form>
        </div>

        <div class="tab-pane fade" id="tabRegistrar">
          <form action="/registro" method="POST">
            <div class="mb-2"><label class="form-label small fw-bold">Nombre Completo</label><input type="text" name="nombre" class="form-control form-control-sm" required></div>
            <div class="mb-2"><label class="form-label small fw-bold">Documento</label><input type="text" name="documento" class="form-control form-control-sm" required></div>
            <div class="mb-2"><label class="form-label small fw-bold">Teléfono</label><input type="text" name="telefono" class="form-control form-control-sm"></div>
            <div class="mb-3"><label class="form-label small fw-bold">Contraseña</label><input type="password" name="clave" class="form-control form-control-sm" required></div>
            <button type="submit" class="btn btn-verde w-100">Registrar Persona</button>
          </form>
        </div>
      </div>

      <div class="mt-3 pt-2 border-top">
        <small class="text-muted d-block mb-1">🕒 Registrados recientemente:</small>
        {% for r in recientes %}
          <span class="badge bg-success bg-opacity-10 text-success border border-success-subtle">{{ r.nombre }} ({{ r.documento }})</span>
        {% endfor %}
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sweetalert2.all.min.js') }}"></script>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <script>
        {% for category, message in messages %}
          Swal.fire({ icon: '{{ category }}', title: 'Aviso', text: '{{ message }}', confirmButtonColor: '#146c38' });
        {% endfor %}
      </script>
    {% endif %}
  {% endwith %}
</body>
</html>
