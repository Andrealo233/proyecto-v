{% extends "principal.html" %}
{% block title %}Asociados y Productos{% endblock %}
{% block content %}
<div class="modulo-card">
  <h5 class="fw-bold text-success mb-3">👥 Gestión de Asociados y Servicios</h5>
  <form method="POST" class="row g-2 mb-4">
    <div class="col-md-4"><input type="text" name="nombre" class="form-control" placeholder="Nombre completo" required></div>
    <div class="col-md-3"><input type="text" name="documento" class="form-control" placeholder="Documento" required></div>
    <div class="col-md-3"><input type="text" name="telefono" class="form-control" placeholder="Teléfono"></div>
    <div class="col-md-2"><button type="submit" class="btn btn-verde w-100">+ Guardar</button></div>
  </form>
  <table class="table table-hover align-middle">
    <thead class="table-light"><tr><th>#</th><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Estado</th></tr></thead>
    <tbody>
      {% for a in asociados %}
      <tr><td>{{ a.id }}</td><td class="fw-bold">{{ a.nombre }}</td><td>{{ a.documento }}</td><td>{{ a.telefono }}</td><td><span class="badge bg-success">{{ a.estado }}</span></td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
